<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HISADA - Inventaris</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">
    <div class="login-container">

      <img src="logo.svg" alt="Logo HISADA" class="login-logo">

      <h1>HISADA</h1>
      <p class="subtitle">Sistem Inventaris</p>

      <div class="tabs">
        <button class="tab active" id="loginTab">Login</button>
        <button class="tab" id="signupTab">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm">

        <label>Username</label>
        <input
          type="text"
          id="loginUsername"
          placeholder="Masukkan username"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Masukkan password"
          required
        >

        <button type="submit" class="primary-btn">
          Login
        </button>

        <p id="loginMessage" class="message"></p>

      </form>

      <!-- SIGN UP -->
      <form id="signupForm" class="hidden">

        <label>Username</label>
        <input
          type="text"
          id="signupUsername"
          placeholder="Buat username"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="signupPassword"
          placeholder="Buat password"
          required
        >

        <label>Bagian</label>
        <select id="signupDepartment" required>
          <option value="">-- Pilih Bagian --</option>
        </select>

        <button type="submit" class="primary-btn">
          Daftar
        </button>

        <p id="signupMessage" class="message"></p>

      </form>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
